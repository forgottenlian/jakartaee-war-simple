<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Converter</title>
</head>

<body>
    <h1>Main</h1>
    <h:form id="convertform-id">
        <h:panelGrid columns="2">
            <h:outputLabel for="typeoperation-id">Conversion type</h:outputLabel>
            <h:selectOneRadio id="typeoperation-id" value="#{converterViewBean.typeOperation}" layout="pageDirection">
                <f:selectItem itemValue="CELSIUS_TO_KELVIN" itemLabel="Celsius to Kelvin" />
                <f:selectItem itemValue="KELVIN_TO_CELSIUS" itemLabel="Kelvin to Celsius" />
            </h:selectOneRadio>

            <h:outputLabel for="from-id">From</h:outputLabel>
            <h:inputText id="from-id" value="#{converterViewBean.from}" required="true"
                requiredMessage="Conversion value is not set">
            </h:inputText>

            <h:outputLabel for="result-id">Result</h:outputLabel>
            <h:outputText id="result-id" value="#{converterViewBean.result}" />

            <h:commandButton value="Convert" action="#{converterRequestBean.convert}" />
            <h:messages showDetail="true" />
        </h:panelGrid>
    </h:form>
</body>

</html>
